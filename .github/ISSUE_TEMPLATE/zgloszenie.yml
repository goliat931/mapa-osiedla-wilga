name: Zgłoszenie uwagi do mapy
description: Błąd lub brak na mapie — droga, hydrant, adres, nazwa ulicy.
title: "[Zgłoszenie] "
labels: ["zgłoszenie", "do weryfikacji"]
body:
  - type: markdown
    attributes:
      value: |
        Dziękujemy! Każde zgłoszenie sprawdzamy, zanim zmienimy mapę. **Zgłoszenie jest publiczne** — nie wpisuj danych osobowych ani numerów telefonów.
  - type: dropdown
    id: typ
    attributes:
      label: Czego dotyczy
      options:
        - Droga nieprzejezdna lub trudny dojazd
        - Droga przejezdna, a na mapie oznaczona inaczej
        - Hydrant lub zbiornik wody
        - Numer domu lub adres
        - Nazwa ulicy
        - Brakująca droga lub skrót
        - Inne
    validations:
      required: true
  - type: input
    id: lokalizacja
    attributes:
      label: Miejsce
      description: Uzupełnia się samo, gdy zgłaszasz z mapy. Możesz też wpisać ulicę i numer domu.
    validations:
      required: true
  - type: textarea
    id: opis
    attributes:
      label: Opis
      description: Co jest nie tak i jak jest w rzeczywistości? Np. „od skrzyżowania z Borowików ok. 30 m na południe jest szlaban”.
    validations:
      required: true
  - type: dropdown
    id: zrodlo
    attributes:
      label: Skąd wiesz
      options:
        - Widziałem/am na miejscu
        - Mieszkam w pobliżu
        - Informacja od OSP / służb
        - Inne
    validations:
      required: true
