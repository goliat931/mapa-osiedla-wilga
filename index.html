<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Mapa Osiedla Wilga</title>
  <meta name="description" content="Mapa Osiedla Wilga — ulice, adresy, przejezdność dróg, hydranty i stromizny.">
  <link rel="icon" href="znak.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="ikony/app-180.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1d1f" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="lib/leaflet/leaflet.min.css">
  <style>
    :root {
      --bg: #f3f5f7;
      --surface: rgba(255,255,255,0.9);
      --surface-strong: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --line: rgba(17,24,39,0.12);
      --green: #15803d;
      --yellow: #eab308;
      --red: #dc2626;
      --shadow: 0 8px 26px rgba(15, 23, 42, 0.12);
      --bar-height: 58px;
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior: none;
    }

    body {
      overflow: hidden;
    }

    .wilga-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--bar-height);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px 0 14px;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      z-index: 1000;
    }

    .wilga-brand {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .wilga-brand svg {
      display: block;
      width: 34px;
      height: 22px;
      color: var(--green);
      flex: 0 0 auto;
    }

    .wilga-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
      overflow: hidden;
    }

    .wilga-nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255,255,255,0.4);
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .wilga-nav a.active {
      color: var(--green);
      background: rgba(21, 128, 61, 0.08);
      border-color: rgba(21, 128, 61, 0.16);
    }

    #map {
      position: fixed;
      inset: var(--bar-height) 0 0 0;
      width: 100vw;
      height: calc(100vh - var(--bar-height));
      background: #dfe8ee;
      z-index: 0;
      touch-action: none;
    }

    .leaflet-container {
      background: #dfe8ee;
      font-family: inherit;
    }

    .leaflet-control-zoom {
      border: none !important;
      box-shadow: var(--shadow) !important;
      overflow: hidden;
      border-radius: 12px !important;
    }

    .leaflet-control-zoom a {
      width: 42px !important;
      height: 42px !important;
      line-height: 42px !important;
      color: var(--text) !important;
      font-size: 22px !important;
      background: rgba(255,255,255,0.9) !important;
    }

    .north-button {
      margin-top: 8px !important;
    }

    .north-button a {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 42px !important;
      height: 42px !important;
      line-height: 42px !important;
      border-radius: 12px !important;
      background: rgba(255,255,255,0.9) !important;
      color: var(--text) !important;
      font-size: 20px !important;
      text-decoration: none !important;
      box-shadow: var(--shadow);
      border: 1px solid rgba(17, 24, 39, 0.06);
    }

    .leaflet-control-attribution {
      background: rgba(255,255,255,0.72) !important;
      backdrop-filter: blur(8px);
      border-radius: 8px 0 0 0;
      padding: 2px 6px !important;
    }

    @media (max-width: 560px) {
      .wilga-bar {
        gap: 8px;
        padding: 0 10px 0 12px;
      }

      .wilga-brand span {
        display: none;
      }

      .wilga-nav a {
        padding: 0 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="wilga-bar" aria-label="Nagłówek mapy">
    <a class="wilga-brand" href="/" aria-label="Strona główna Osiedla Wilga">
      <svg viewBox="0 0 210 130" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M14 94L85 12L115 48L194 12V48L113 130L14 94Z" stroke="currentColor" stroke-width="12" stroke-linejoin="round"/>
        <path d="M18 92H118L60 113L18 92Z" stroke="currentColor" stroke-width="12" stroke-linejoin="round"/>
      </svg>
      <span>Wilga</span>
    </a>

    <nav class="wilga-nav" aria-label="Nawigacja">
      <a class="active" href="#">Mapa</a>
    </nav>
  </header>

  <div id="map" aria-label="Mapa Osiedla Wilga"></div>

  <script src="lib/leaflet/leaflet.min.js"></script>
  <script src="lib/leaflet-rotate/leaflet-rotate.js"></script>
  <script>
    const map = L.map('map', {
      zoomControl: false,
      minZoom: 12,
      maxZoom: 20,
      rotate: true,
      touchRotate: false,
      rotateControl: false,
      attributionControl: true
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const northControl = L.control({ position: 'bottomright' });
    northControl.onAdd = function () {
      const div = L.DomUtil.create('div', 'leaflet-bar north-button');
      const link = L.DomUtil.create('a', '', div);
      link.href = '#';
      link.title = 'Północ u góry';
      link.setAttribute('aria-label', 'Północ u góry');
      link.innerHTML = '⤢';
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.on(link, 'click', function (event) {
        event.preventDefault();
        map.setBearing(0);
      });
      return div;
    };
    northControl.addTo(map);

    const getTouchAngle = function (touchList) {
      if (!touchList || touchList.length < 2) return null;
      const a = touchList[0];
      const b = touchList[1];
      return Math.atan2(b.clientY - a.clientY, b.clientX - a.clientX) * 180 / Math.PI;
    };

    let gestureState = null;
    const mapContainer = map.getContainer();

    mapContainer.addEventListener('touchstart', function (event) {
      if (event.touches.length !== 2) return;
      const startAngle = getTouchAngle(event.touches);
      if (startAngle === null) return;
      gestureState = {
        startAngle,
        startBearing: map.getBearing()
      };
    }, { passive: true });

    mapContainer.addEventListener('touchmove', function (event) {
      if (event.touches.length !== 2 || !gestureState) return;
      const angle = getTouchAngle(event.touches);
      if (angle === null) return;

      const delta = angle - gestureState.startAngle;
      if (Math.abs(delta) > 12) {
        map.setBearing(gestureState.startBearing + delta);
        gestureState.startAngle = angle;
        gestureState.startBearing = map.getBearing();
      }
    }, { passive: true });

    mapContainer.addEventListener('touchend', function () {
      gestureState = null;
    }, { passive: true });

    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 20,
      maxNativeZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const topographic = L.tileLayer.wms('https://mapy.geoportal.gov.pl/wss/service/PZGIK/NMT/GRID1/WMS/ShadedRelief', {
      layers: 'Raster',
      format: 'image/png',
      transparent: true,
      maxZoom: 20,
      attribution: 'Geoportal'
    });

    const ortho = L.tileLayer.wms('https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolution', {
      layers: 'Raster',
      format: 'image/jpeg',
      maxZoom: 20,
      attribution: 'Ortofotomapa'
    });

    const baseLayers = {
      'OpenStreetMap': osm,
      'Ortofotomapa': orto,
      'Teren': topographic
    };

    L.control.layers(baseLayers, {}, { collapsed: true, position: 'topleft' }).addTo(map);

    map.setView([51.8384, 21.4176], 14);
  </script>
</body>
</html>
